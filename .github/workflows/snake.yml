name: Generate Snake Animation

on:
  schedule:
    # Atualiza diariamente às 03:00 UTC
    - cron: "0 3 * * *"

  # Permite executar manualmente
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    name: Generate contribution snake
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate snake animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: enejota-njs

          outputs: |
            dist/github-snake.svg?palette=github-light
            dist/github-snake-dark.svg?palette=github-dark&color_snake=blue

      - name: Publish animations
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          force_orphan: true
